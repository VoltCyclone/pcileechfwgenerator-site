name = "pcileech-docs"
main = "src/index.ts"
compatibility_date = "2025-08-10"

# Static asset configuration
[assets]
directory = "../site"
binding = "ASSETS"

# Workers Logs off. Invocations and console output go to Vector through the
# vector-tail Tail Worker instead, so deploy vector-tail before this change.
[observability]
enabled = false

[[tail_consumers]]
service = "vector-tail"
